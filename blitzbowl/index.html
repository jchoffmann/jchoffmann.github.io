color-gold-400: #fbbf24;\n  --color-gold-500: #f59e0b;\n  --color-gold-600: #d97706;\n  --color-gold-glow: rgba(245, 158, 11, 0.35);\n\n  --color-blood-500: #ef4444;\n  --color-blood-700: #b91c1c;\n\n  --color-dark-900: #070a12;\n  --color-dark-800: #0d121f;\n  --color-dark-700: #151e32;\n  --color-dark-600: #1e293b;\n\n  --color-card-bg: rgba(15, 23, 42, 0.88);\n  --color-card-border: rgba(245, 158, 11, 0.28);\n  --color-card-border-hover: rgba(245, 158, 11, 0.6);\n\n  --color-text-main: #f8fafc;\n  --color-text-muted: #94a3b8;\n  --color-text-dim: #64748b;\n\n  --font-title: 'Cinzel', serif;\n  --font-accent: 'Teko', sans-serif;\n  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;\n\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n\n  --shadow-main: 0 16px 40px -8px rgba(0, 0, 0, 0.7), 0 0 25px rgba(245, 158, 11, 0.12);\n  --shadow-glow: 0 0 15px rgba(245, 158, 11, 0.4);\n}\n\n/* Base Reset & Typography */\n*, *::before, *::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml {\n  font-family: var(--font-body);\n  font-size: 16px;\n  line-height: 1.6;\n  color: var(--color-text-main);\n  background-color: var(--color-dark-900);\n  min-height: 100%;\n}\n\nbody {\n  position: relative;\n  min-height: 100vh;\n  overflow-x: hidden;\n  color: var(--color-text-main);\n  background-color: var(--color-dark-900);\n}\n\n/* Background Layers */\n.bg-layer {\n  position: fixed;\n  inset: 0;\n  width: 100vw;\n  height: 100vh;\n  z-index: -2;\n  background-image: url(${h});\n  background-size: cover;\n  background-position: center 20%;\n  background-repeat: no-repeat;\n  filter: brightness(0.85) contrast(1.05);\n  transform: scale(1.02);\n  transition: transform 0.5s ease;\n}\n\n.bg-overlay {\n  position: fixed;\n  inset: 0;\n  width: 100vw;\n  height: 100vh;\n  z-index: -1;\n  background: radial-gradient(circle at 50% 20%, rgba(13, 18, 31, 0.65) 0%, rgba(7, 10, 18, 0.94) 85%),\n
